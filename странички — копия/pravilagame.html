<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изображение на весь экран</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .image-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
        .menu-button {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        a {
            text-decoration: none; /* Убираем подчёркивание */
        }
        .menu-button a {
            position: absolute; /* Позиционирование кнопки */
            top: 650px; /* Отступ сверху */
            left: 600px; /* Отступ слева */
            padding: 15px 30px; /*размер нашей кнопочки*/
            font-size: 1.2em; 
            color: rgb(0, 0, 0);/*цвет шрифта*/
            background-color: #b2bcc8;/*цвет кнопки до нажатия*/
            border: none;
            border-radius: 300px; /* от этого зависит форма кнопки :3*/
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .menu-button a:hover {
            color: rgb(255, 255, 255);
            background-color: #282c31;/*цвет кнопки после нажатия*/
    </style>
</head>
<body>

    <div class="image-container">
        <!-- Ваше изображение -->
        <img src="rules.jpg" alt="Большое изображение">
    </div>

    <!-- Кнопка внизу для возврата в главное меню -->
    <div class="menu-button">
        <a href="menu.html">В главное меню</a>
    </div>

</body>
</html>
